; Supervisor config for the Laravel queue worker.
;
; Without this running in production, all ShouldQueue notifications
; (approval emails, overdue reminders, etc.) will pile up in the
; `jobs` database table and never be delivered, because nothing is
; running `php artisan queue:work` outside of local dev
; (composer.json's "dev" script only starts `queue:listen` on your machine).
;
; Install: copy to /etc/supervisor/conf.d/purchasing-app-worker.conf,
; then run: supervisorctl reread && supervisorctl update && supervisorctl start purchasing-app-worker:*

[program:purchasing-app-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/purchasing-app/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/purchasing-app/storage/logs/worker.log
stopwaitsecs=3600
